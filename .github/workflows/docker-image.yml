name: Build and publish Docker image

# Publishes to GitHub Container Registry (ghcr.io). New GHCR packages are
# private by default — the image stays private until you change it under
# Packages -> Package settings.
#
# Two triggers:
#   push to master  — rebuilds :latest, as requested
#   workflow_dispatch — build any branch on demand, so a branch can be tested
#                       before it is merged into master
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
      tag:
        description: "Image tag to publish (defaults to the branch name)"
        required: false
        default: ""

concurrency:
  # Never let two builds race to publish the same tag.
  group: docker-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Empty string falls back to the triggering ref.
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Needed to build the Komelia web UI that komf serves at "/".
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches jvmTarget JVM_17 in the Gradle build.
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish patched komf-client to Maven Local
        # Komelia pins a komf-client release from Maven Central, which emits
        # absolute "/api/..." paths and so drops any reverse-proxy subpath. The
        # fix lives in this repo's source, so the client is published locally
        # under a unique version and Komelia is pointed at it below.
        run: |
          set -euo pipefail
          ver="1.6.2-subpath-${GITHUB_SHA::7}"
          echo "KOMF_CLIENT_VERSION=$ver" >> "$GITHUB_ENV"

          # komf-client and komf-api-models both take their version from this
          # catalog entry. komf-app is pinned to 1.0.0-SNAPSHOT independently,
          # so the JAR name the Dockerfile copies is unaffected.
          sed -i -E "s|^app-version = \"[^\"]*\"$|app-version = \"$ver\"|" gradle/libs.versions.toml
          grep -qx "app-version = \"$ver\"" gradle/libs.versions.toml \
            || { echo "::error::Failed to override app-version."; exit 1; }

          ./gradlew --no-daemon \
            --init-script .github/no-signing.init.gradle.kts \
            :komf-api-models:publishToMavenLocal \
            :komf-client:publishToMavenLocal

          # Restore the catalog so the application build is unchanged; the
          # artifacts Komelia needs are already in ~/.m2.
          git checkout -- gradle/libs.versions.toml
          echo "Published komf-client $ver to Maven Local"

      - name: Point Komelia at the patched client
        run: |
          set -euo pipefail
          toml="Komelia/gradle/libs.versions.toml"

          # "komf-client" appears twice: the version string under [versions] and
          # the module declaration under [libraries]. Match only the bare quoted
          # value so the library entry is left intact.
          sed -i -E "s|^komf-client = \"[^\"]*\"$|komf-client = \"${KOMF_CLIENT_VERSION}\"|" "$toml"

          if ! grep -qx "komf-client = \"${KOMF_CLIENT_VERSION}\"" "$toml"; then
            echo "::error::Failed to override the komf-client version in $toml."
            grep -n '^komf-client' "$toml" || true
            exit 1
          fi
          if ! grep -q '^komf-client = { module = "io.github.snd-r.komf:client"' "$toml"; then
            echo "::error::The komf-client library declaration was damaged."
            grep -n '^komf-client' "$toml" || true
            exit 1
          fi
          grep -n '^komf-client' "$toml"

          # Komelia lists mavenLocal() after mavenCentral(), so reusing a
          # released version number would silently resolve the unpatched
          # artifact from Central. This version exists only locally, so a failed
          # publish surfaces as a resolution error instead of a wrong build.

      - name: Build Komelia web UI
        # komf serves this at "/" via staticResources(basePackage = "komelia").
        # The repo has no Gradle wiring for it — upstream injects it during its
        # own release process — so it is built here from the pinned submodule.
        working-directory: Komelia
        run: |
          ./gradlew --no-daemon \
            :komelia-app:wasmJsBrowserDistribution \
            :komelia-image-decoder:wasm-image-worker:wasmJsBrowserDistribution

      - name: Embed web UI into komf resources
        run: |
          set -euo pipefail
          app="Komelia/komelia-app/build/dist/wasmJs/productionExecutable"
          worker="Komelia/komelia-image-decoder/wasm-image-worker/build/dist/wasmJs/productionExecutable"
          dest="komf-app/src/main/resources/komelia"

          for d in "$app" "$worker"; do
            if [ ! -d "$d" ]; then
              echo "::error::Expected Komelia output at $d but it does not exist."
              exit 1
            fi
          done

          mkdir -p "$dest"
          cp -R "$app"/. "$dest"/
          cp -R "$worker"/. "$dest"/

          if [ ! -f "$dest/index.html" ]; then
            echo "::error::No index.html in $dest; komf would serve 404 at /."
            ls -la "$dest" || true
            exit 1
          fi

          # ServerModule installs preCompressed(GZIP), so ship .gz alongside the
          # originals. Keeping both means a client that does not advertise gzip
          # still gets a response.
          find "$dest" -type f \
            ! -name '*.gz' \
            ! -name '*.map' \
            -size +1k \
            -exec gzip -9 -k -f {} +

          echo "Embedded $(find "$dest" -type f | wc -l) files ($(du -sh "$dest" | cut -f1))"

      - name: Build browser extension
        # The Chrome Web Store build is compiled against the released client and
        # can never carry this fix, so a sideloadable build is produced here.
        working-directory: Komelia
        run: ./gradlew --no-daemon :komelia-komf-extension:app:assembleExtension

      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: komf-extension-${{ github.sha }}
          path: Komelia/komelia-komf-extension/app/build/extension
          if-no-files-found: error

      - name: Build fat JAR
        # The Dockerfile COPYs this artifact rather than building it, so it has
        # to exist before the image build.
        run: ./gradlew :komf-app:shadowJar --no-daemon

      - name: Verify the JAR the Dockerfile expects
        run: |
          set -euo pipefail
          jar="komf-app/build/libs/komf-app-1.0.0-SNAPSHOT-all.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Expected $jar but it was not produced."
            echo "If the Gradle version changed, the Dockerfile COPY path needs updating too."
            ls -la komf-app/build/libs/ || true
            exit 1
          fi
          echo "Built $(du -h "$jar" | cut -f1) JAR"

          # Guard against shipping an image that 404s at "/" — the web UI is
          # copied in as a build step, so nothing else would catch its absence.
          count=$(unzip -l "$jar" | grep -c 'komelia/' || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::JAR contains no komelia/ resources; the web UI would 404."
            exit 1
          fi
          echo "JAR contains $count komelia/ entries"

      - name: Compute image name and tag
        id: meta
        run: |
          set -euo pipefail
          # GHCR rejects uppercase characters, and GitHub owner names may
          # contain them, so normalise before using it as an image name.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          explicit_tag='${{ github.event.inputs.tag }}'
          if [ -n "$explicit_tag" ]; then
            tag="$explicit_tag"
          elif [ '${{ github.ref }}' = 'refs/heads/master' ] && [ -z '${{ github.event.inputs.ref }}' ]; then
            tag="latest"
          else
            # Branch names contain characters that are illegal in tags.
            raw='${{ github.event.inputs.ref || github.ref_name }}'
            tag="$(echo "$raw" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $image:$tag"

      - name: Set up QEMU
        # Needed for the arm64 image: the Dockerfile installs apprise via pipx,
        # which runs under emulation and is the slow part of this build.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token; no secret needs to be configured for GHCR.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo
            echo "Also tagged \`${{ github.sha }}\`."
            echo
            echo "This package is **private** by default. To pull it on your server,"
            echo "authenticate with a personal access token that has \`read:packages\`:"
            echo
            echo '```'
            echo "echo \$TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
