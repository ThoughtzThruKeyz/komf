name: Build and publish Docker image

# Publishes to GitHub Container Registry (ghcr.io). New GHCR packages are
# private by default — the image stays private until you change it under
# Packages -> Package settings.
#
# Two triggers:
#   push to master  — rebuilds :latest, as requested
#   workflow_dispatch — build any branch on demand, so a branch can be tested
#                       before it is merged into master
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
      tag:
        description: "Image tag to publish (defaults to the branch name)"
        required: false
        default: ""

concurrency:
  # Never let two builds race to publish the same tag.
  group: docker-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Empty string falls back to the triggering ref.
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Needed to build the Komelia web UI that komf serves at "/".
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches jvmTarget JVM_17 in the Gradle build.
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish patched komf-client to Maven Local
        # Komelia pins a komf-client release from Maven Central, which emits
        # absolute "/api/..." paths and so drops any reverse-proxy subpath. The
        # fix lives in this repo's source, so the client is published locally
        # under a unique version and Komelia is pointed at it below.
        run: |
          set -euo pipefail
          ver="1.6.2-subpath-${GITHUB_SHA::7}"
          echo "KOMF_CLIENT_VERSION=$ver" >> "$GITHUB_ENV"

          # komf-client and komf-api-models both take their version from this
          # catalog entry. komf-app is pinned to 1.0.0-SNAPSHOT independently,
          # so the JAR name the Dockerfile copies is unaffected.
          sed -i -E "s|^app-version = \"[^\"]*\"$|app-version = \"$ver\"|" gradle/libs.versions.toml
          if ! grep -qx "app-version = \"$ver\"" gradle/libs.versions.toml; then
            echo "::error::Failed to override app-version."
            exit 1
          fi

          # Both modules call signAllPublications(), which is right for Maven
          # Central but fatal here: useGpgCmd() means Gradle believes a
          # signatory exists and invokes gpg, which has no key in CI. Marking
          # signing as not required does not help, because that only covers a
          # missing signatory, not a failing one. Removing the call instead
          # means no Sign tasks are registered at all. The signing {} block can
          # stay: on its own it configures a signatory without signing
          # anything. These artifacts never leave the runner, so they do not
          # need signatures.
          for f in komf-client/build.gradle.kts komf-api-models/build.gradle.kts; do
            sed -i 's|^\( *\)signAllPublications()|\1// signAllPublications() removed for local-only publish|' "$f"
            if grep -qE '^ *signAllPublications\(\)' "$f"; then
              echo "::error::Failed to disable publication signing in $f."
              exit 1
            fi
          done

          ./gradlew --no-daemon \
            :komf-api-models:publishToMavenLocal \
            :komf-client:publishToMavenLocal

          # Restore every edited file so the application build is unchanged; the
          # artifacts Komelia needs are already in ~/.m2.
          git checkout -- \
            gradle/libs.versions.toml \
            komf-client/build.gradle.kts \
            komf-api-models/build.gradle.kts
          echo "Published komf-client $ver to Maven Local"

      - name: Point Komelia at the patched client
        run: |
          set -euo pipefail
          toml="Komelia/gradle/libs.versions.toml"

          # "komf-client" appears twice: the version string under [versions] and
          # the module declaration under [libraries]. Match only the bare quoted
          # value so the library entry is left intact.
          sed -i -E "s|^komf-client = \"[^\"]*\"$|komf-client = \"${KOMF_CLIENT_VERSION}\"|" "$toml"

          if ! grep -qx "komf-client = \"${KOMF_CLIENT_VERSION}\"" "$toml"; then
            echo "::error::Failed to override the komf-client version in $toml."
            grep -n '^komf-client' "$toml" || true
            exit 1
          fi
          if ! grep -q '^komf-client = { module = "io.github.snd-r.komf:client"' "$toml"; then
            echo "::error::The komf-client library declaration was damaged."
            grep -n '^komf-client' "$toml" || true
            exit 1
          fi
          grep -n '^komf-client' "$toml"

          # Komelia lists mavenLocal() after mavenCentral(), so reusing a
          # released version number would silently resolve the unpatched
          # artifact from Central. This version exists only locally, so a failed
          # publish surfaces as a resolution error instead of a wrong build.

      - name: Build Komelia web UI
        # komf serves this at "/" via staticResources(basePackage = "komelia").
        # The repo has no Gradle wiring for it — upstream injects it during its
        # own release process — so it is built here from the pinned submodule.
        working-directory: Komelia
        run: |
          ./gradlew --no-daemon \
            :komelia-app:webApp:wasmJsBrowserDistribution \
            :komelia-infra:image-decoder:wasm-image-worker:wasmJsBrowserDistribution

      - name: Embed web UI into komf resources
        run: |
          set -euo pipefail
          app="Komelia/komelia-app/webApp/build/dist/wasmJs/productionExecutable"
          worker="Komelia/komelia-infra/image-decoder/wasm-image-worker/build/dist/wasmJs/productionExecutable"
          dest="komf-app/src/main/resources/komelia"

          for d in "$app" "$worker"; do
            if [ ! -d "$d" ]; then
              echo "::error::Expected Komelia output at $d but it does not exist."
              exit 1
            fi
          done

          mkdir -p "$dest"
          cp -R "$app"/. "$dest"/
          cp -R "$worker"/. "$dest"/

          if [ ! -f "$dest/index.html" ]; then
            echo "::error::No index.html in $dest; komf would serve 404 at /."
            ls -la "$dest" || true
            exit 1
          fi

          # ServerModule installs preCompressed(GZIP), so ship .gz alongside the
          # originals. Keeping both means a client that does not advertise gzip
          # still gets a response.
          find "$dest" -type f \
            ! -name '*.gz' \
            ! -name '*.map' \
            -size +1k \
            -exec gzip -9 -k -f {} +

          echo "Embedded $(find "$dest" -type f | wc -l) files ($(du -sh "$dest" | cut -f1))"

      - name: Fix Kavita detection for Kavita 0.9.x
        # The extension picks its media-server component from the first
        # space-delimited word of document.title, requiring exactly "Kavita":
        #
        #   when (document.title.split(' ')[0]) { "Kavita" -> ... else -> Komga }
        #
        # Kavita 0.9.x titles pages as "<Page> (Kavita)" — e.g. "Home (Kavita)"
        # — so the first word is "Home" and it silently falls back to the Komga
        # component, which looks for Komga's DOM, finds nothing, and mounts no
        # button. No error is logged, so it just appears not to work.
        #
        # Match "Kavita" anywhere in the title instead, leaving the Komga path
        # untouched. Patch the checked-out submodule so the change is compiled
        # in, and keep it idempotent so it no-ops once upstream fixes this.
        #
        # Also log the title and the component actually selected. Detection
        # failures are otherwise completely silent — the content script loads
        # and simply mounts nothing — which makes this impossible to diagnose
        # from the outside, and makes it impossible to tell a stale install
        # from a failing patch.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          path = "Komelia/komelia-komf-extension/content/src/wasmJsMain/kotlin/snd/komelia/AppState.kt"

          edits = [
              (
                  "when (document.title.split(' ')[0]) {",
                  'logger.info { "Komf: title=\\"${document.title}\\"" }\n'
                  "        when (if (document.title.contains(\"Kavita\")) \"Kavita\" "
                  "else document.title.split(' ')[0]) {",
              ),
              (
                  "mediaServerComponent = KavitaComponent(theme, currentDialog)",
                  "mediaServerComponent = KavitaComponent(theme, currentDialog)\n"
                  '                logger.info { "Komf: using KavitaComponent" }',
              ),
              (
                  "mediaServerComponent = KomgaComponent(theme, currentDialog)",
                  "mediaServerComponent = KomgaComponent(theme, currentDialog)\n"
                  '                logger.info { "Komf: using KomgaComponent" }',
              ),
          ]

          with open(path) as fh:
              source = fh.read()

          if 'logger.info { "Komf: title=' in source:
              print(f"{path}: already patched, left alone")
              sys.exit(0)

          for old, new in edits:
              count = source.count(old)
              if count != 1:
                  print(f"::error::Expected exactly 1 occurrence of {old!r} in "
                        f"{path}, found {count}. Upstream may have changed it; "
                        f"re-check before assuming this patch applies.")
                  sys.exit(1)
              source = source.replace(old, new)

          with open(path, "w") as fh:
              fh.write(source)
          print(f"{path}: Kavita detection fixed, media-server selection now logged")
          PY

      - name: Trace extension startup
        # main() launches a coroutine with no error handling:
        #
        #   coroutineScope.launch {
        #       val app = initApplication(coroutineScope)
        #       app.launch()
        #   }
        #
        # Anything thrown inside it — client construction, settings access,
        # Compose setup — kills the coroutine silently. The page shows the
        # logger init line and then nothing, which is indistinguishable from
        # "never injected". Wrap it so failures are actually reported, and
        # trace each stage so a partial startup is visible too.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          path = "Komelia/komelia-komf-extension/content/src/wasmJsMain/kotlin/snd/komelia/Main.kt"
          old = ("        val app = initApplication(coroutineScope)\n"
                 "        app.launch()")
          new = ("        try {\n"
                 '            logger.info { "Komf: startup begin" }\n'
                 "            val app = initApplication(coroutineScope)\n"
                 '            logger.info { "Komf: initApplication ok" }\n'
                 "            app.launch()\n"
                 '            logger.info { "Komf: launch ok" }\n'
                 "        } catch (e: Throwable) {\n"
                 '            logger.error(e) { "Komf: startup FAILED: ${e::class.simpleName}: ${e.message}" }\n'
                 "        }")

          with open(path) as fh:
              source = fh.read()

          if '"Komf: startup begin"' in source:
              print(f"{path}: already patched, left alone")
              sys.exit(0)

          count = source.count(old)
          if count != 1:
              print(f"::error::Expected exactly 1 occurrence of the main() body in "
                    f"{path}, found {count}. Upstream may have changed it.")
              sys.exit(1)

          with open(path, "w") as fh:
              fh.write(source.replace(old, new))
          print(f"{path}: startup now traced and exceptions reported")
          PY

      - name: Build browser extensions
        # The store builds are compiled against the released client and can
        # never carry this fix, so sideloadable builds are produced here. The
        # extension tasks are registered per target browser.
        working-directory: Komelia
        run: |
          ./gradlew --no-daemon \
            :komelia-komf-extension:app:assembleExtension_prod_firefox \
            :komelia-komf-extension:app:assembleExtension_prod_chrome

      - name: Declare "scripting" as an optional permission (Firefox)
        # The manifests at the pinned Komelia list "scripting" under permissions
        # but omit optional_permissions, while the extension requests it at
        # runtime when an origin is granted. Firefox refuses to request a
        # permission that is not declared optional, so granting an origin fails
        # with:
        #   Cannot request permission scripting since it was not declared in
        #   optional_permissions
        # An earlier Komelia declared it in both places; this is a regression in
        # the newer tree. Patch the built manifest rather than the submodule so
        # the fix survives a submodule bump and disappears on its own once
        # upstream restores the declaration.
        run: |
          set -euo pipefail
          patched=0
          # Firefox only. Chrome grants "scripting" at install because it is a
          # required permission, and rejects the optional entry as redundant:
          #   Optional permission 'scripting' is redundant with the required
          #   permissions; this permission will be omitted.
          # Firefox instead refuses permissions.request() for anything absent
          # from optional_permissions, even when it is already required.
          for browser in firefox; do
            manifest="Komelia/komelia-komf-extension/app/build/extension_prod_${browser}/manifest.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::Expected $manifest but it does not exist."
              exit 1
            fi
            python3 - "$manifest" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as fh:
              manifest = json.load(fh)
          optional = manifest.get("optional_permissions", [])
          if "scripting" in optional:
              print(f"{path}: already declared, left alone")
              sys.exit(0)
          optional.append("scripting")
          manifest["optional_permissions"] = optional
          with open(path, "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(f"{path}: added scripting to optional_permissions")
          PY
            patched=$((patched + 1))
          done
          echo "Checked $patched manifests"

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: komf-extension-firefox-${{ github.sha }}
          path: Komelia/komelia-komf-extension/app/build/extension_prod_firefox
          if-no-files-found: error

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: komf-extension-chrome-${{ github.sha }}
          path: Komelia/komelia-komf-extension/app/build/extension_prod_chrome
          if-no-files-found: error

      - name: Build fat JAR
        # The Dockerfile COPYs this artifact rather than building it, so it has
        # to exist before the image build.
        run: ./gradlew :komf-app:shadowJar --no-daemon

      - name: Verify the JAR the Dockerfile expects
        run: |
          set -euo pipefail
          jar="komf-app/build/libs/komf-app-1.0.0-SNAPSHOT-all.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Expected $jar but it was not produced."
            echo "If the Gradle version changed, the Dockerfile COPY path needs updating too."
            ls -la komf-app/build/libs/ || true
            exit 1
          fi
          echo "Built $(du -h "$jar" | cut -f1) JAR"

          # Guard against shipping an image that 404s at "/" — the web UI is
          # copied in as a build step, so nothing else would catch its absence.
          count=$(unzip -l "$jar" | grep -c 'komelia/' || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::JAR contains no komelia/ resources; the web UI would 404."
            exit 1
          fi
          echo "JAR contains $count komelia/ entries"

      - name: Compute image name and tag
        id: meta
        run: |
          set -euo pipefail
          # GHCR rejects uppercase characters, and GitHub owner names may
          # contain them, so normalise before using it as an image name.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          explicit_tag='${{ github.event.inputs.tag }}'
          if [ -n "$explicit_tag" ]; then
            tag="$explicit_tag"
          elif [ '${{ github.ref }}' = 'refs/heads/master' ] && [ -z '${{ github.event.inputs.ref }}' ]; then
            tag="latest"
          else
            # Branch names contain characters that are illegal in tags.
            raw='${{ github.event.inputs.ref || github.ref_name }}'
            tag="$(echo "$raw" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $image:$tag"

      - name: Set up QEMU
        # Needed for the arm64 image: the Dockerfile installs apprise via pipx,
        # which runs under emulation and is the slow part of this build.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token; no secret needs to be configured for GHCR.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo
            echo "Also tagged \`${{ github.sha }}\`."
            echo
            echo "This package is **private** by default. To pull it on your server,"
            echo "authenticate with a personal access token that has \`read:packages\`:"
            echo
            echo '```'
            echo "echo \$TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
